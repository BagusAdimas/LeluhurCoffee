<style>
  .search-page {
    padding: 120px 7% 50px;
    background-color: transparent;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    font-family: "Poppins", sans-serif;
  }

  .search-wrapper {
    width: 100%;
    max-width: 600px;
    text-align: center;
  }

  .search-wrapper h2 {
    color: white;
    font-size: 2rem;
    margin-bottom: 1.5rem;
    font-weight: 700;
  }

  .search-form .input-group {
    display: flex;
    border: 2px solid #e1e1e1;
    border-radius: 8px;
    overflow: hidden;
    transition: border-color 0.3s ease;
  }

  .search-form .input-group:focus-within {
    border-color: #b6895b;
  }

  .search-form input {
    flex: 1;
    padding: 12px 20px;
    border: none;
    outline: none;
    font-size: 1rem;
    background: transparent;
    color: #fff;
  }

  .search-form .search-btn {
    background: #fff;
    border: none;
    padding: 0 15px;
    cursor: pointer;
    color: #333;
    display: flex;
    align-items: center;
    transition: color 0.3s;
  }

  .search-form .search-btn:hover {
    color: #b6895b;
  }

  .search-results {
    margin-top: 20px;
    color: #777;
    font-size: 0.7rem;
  }

  body.search-page {
    background-image: url(../img/header-bg.jpg);
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    margin: 0;
    padding: 1.4rem 7%;
    display: block;
  }
</style>

<div class="search-form">
  <div class="input-group">
    <input type="text" id="search-input" placeholder="Cari menu..." />
    <button type="button" class="search-btn" onclick="handleSearch()">
      <i data-feather="search"></i>
    </button>
  </div>
</div>

<script>
  function handleSearch() {
    const query = document.getElementById("search-input").value;
    if (query) {
      // Mengarahkan ke route menu dengan hash (agar ditangkap routers.js)
      window.location.hash = `#/menu?search=${encodeURIComponent(query)}`;
    }
  }
  // Aktifkan icon feather jika diperlukan
  if (typeof feather !== "undefined") feather.replace();
</script>
