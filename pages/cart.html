<style>
  /* --- CSS Khusus Halaman Cart --- */
  body.cart-page {
    background-image: url(../img/header-bg.jpg);
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    margin: 0;
    padding: 1.4rem 7%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .cart-page-wrapper {
    padding: 120px 7% 50px;
    font-family: "Poppins", sans-serif;
    color: white;
    min-height: 100vh;
  }

  .cart-title {
    font-size: 2.2rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 2rem;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  }

  .cart-container {
    display: grid;
    grid-template-columns: 2fr 1fr; /* Bagian kiri lebih lebar dari kanan */
    gap: 30px;
    align-items: start;
  }

  /* --- Daftar Item Belanja (Kiri) --- */
  .cart-items-wrapper {
    background-color: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .cart-item {
    display: flex;
    align-items: center;
    background-color: rgba(0, 0, 0, 0.3);
    padding: 15px;
    border-radius: 15px;
    gap: 15px;
    transition: 0.3s;
  }

  .cart-item:hover {
    background-color: rgba(0, 0, 0, 0.5);
  }

  .cart-item img {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    object-fit: cover;
  }

  .item-details {
    flex: 1;
  }

  .item-details h3 {
    font-size: 1.1rem;
    margin-bottom: 5px;
    color: #fff;
  }

  .item-details .item-price {
    color: #b6895b; /* Warna Emas Kopi */
    font-weight: bold;
  }

  .item-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .btn-remove {
    background-color: rgba(255, 0, 0, 0.2);
    color: #ff6b6b;
    border: 1px solid rgba(255, 0, 0, 0.3);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: 0.3s;
  }

  .btn-remove:hover {
    background-color: rgba(255, 0, 0, 0.8);
    color: white;
  }

  /* --- Ringkasan Belanja (Kanan) --- */
  .cart-summary {
    background-color: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 25px;
    position: sticky;
    top: 100px; /* Agar tetap terlihat saat scroll */
  }

  .cart-summary h3 {
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    padding-bottom: 15px;
    margin-bottom: 15px;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 0.9rem;
    color: #ddd;
  }

  .summary-total {
    display: flex;
    justify-content: space-between;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 2px dashed rgba(255, 255, 255, 0.2);
    font-size: 1.2rem;
    font-weight: bold;
    color: #b6895b;
  }

  .btn-checkout {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    background-color: #b6895b;
    color: white;
    font-weight: bold;
    text-align: center;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
    text-transform: uppercase;
  }

  .btn-checkout:hover {
    background-color: #8c5f44;
    transform: scale(1.02);
  }

  /* Responsif untuk HP */
  @media (max-width: 768px) {
    .cart-container {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="cart-page-wrapper">
  <h1 class="cart-title">Keranjang Belanja Anda</h1>

  <div class="cart-container">
    <div class="cart-items-wrapper" id="cart-items-container">
      <p style="text-align: center; color: #ccc">Memuat keranjang...</p>
    </div>

    <div class="cart-summary">
      <h3>Ringkasan</h3>
      <div class="summary-row">
        <span>Total Item</span>
        <span id="total-items">0</span>
      </div>
      <div class="summary-row">
        <span>Pajak (10%)</span>
        <span id="tax-amount">Rp 0</span>
      </div>
      <div class="summary-total">
        <span>Total Bayar</span>
        <span id="final-total">Rp 0</span>
      </div>
      <div class="btn-checkout" onclick="alert('Lanjut ke pembayaran...')">
        Checkout Sekarang
      </div>
    </div>
  </div>
</div>

<script>
  function renderCart() {
    let cart = JSON.parse(localStorage.getItem("coffee_cart")) || [];
    const container = document.getElementById("cart-items-container");
    let subtotal = 0;

    if (cart.length === 0) {
      container.innerHTML =
        '<p style="text-align: center; color: #ccc">Keranjang kosong</p>';
    } else {
      container.innerHTML = cart
        .map((item, index) => {
          // Membersihkan "Rp 25.000" menjadi angka 25000
          let cleanPrice = parseInt(item.price.replace(/[^0-9]/g, ""));
          if (!isNaN(cleanPrice)) subtotal += cleanPrice;

          return `
        <div class="cart-item" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; background:rgba(255,255,255,0.1); padding:15px; border-radius:15px;">
          <div style="display:flex; align-items:center; gap:15px;">
            <img src="${item.img}" width="60" height="60" style="object-fit:cover; border-radius:10px;">
            <div>
              <h4 style="margin:0">${item.name}</h4>
              <p style="margin:5px 0; color:#b6895b">${item.price}</p>
            </div>
          </div>
          <button onclick="removeFromCart(${index})" style="background:#ff4d4d; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">Hapus</button>
        </div>`;
        })
        .join("");
    }

    // Hitung Pajak 10%
    const tax = subtotal * 0.1;
    document.getElementById("total-items").innerText = cart.length;
    document.getElementById("tax-amount").innerText =
      "Rp " + tax.toLocaleString("id-ID");
    document.getElementById("final-total").innerText =
      "Rp " + (subtotal + tax).toLocaleString("id-ID");
  }

  function removeFromCart(index) {
    let cart = JSON.parse(localStorage.getItem("coffee_cart")) || [];
    cart.splice(index, 1);
    localStorage.setItem("coffee_cart", JSON.stringify(cart));
    renderCart();
  }

  window.onload = renderCart;
  setTimeout(() => {
    if (typeof renderCart === "function") {
      renderCart();
    }
  }, 100);
</script>
