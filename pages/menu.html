<style>
  body.menu-page {
    padding-top: 100px;
    background-image: url("../img/header-bg.jpg");
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    min-height: 100vh;
    margin: 0;
    padding: 1.4rem 7%;
    display: block;
  }

  .menu-img {
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
  }

  .menu-container {
    padding: 2rem 7%;
    min-height: 100vh;
    margin-top: 60px;
  }

  .menu-utamas-coffee {
    display: flex;
    flex-direction: column;
    gap: 25px;
  }

  .cold-menu,
  .hot-menu,
  .pastry-menu {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background-color: rgba(255, 255, 255, 0.1);
    padding: 25px;
    border-radius: 30px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    cursor: pointer;
    transition: 0.3s;
  }

  .cold-menu:hover,
  .hot-menu:hover,
  .pastry-menu:hover {
    background-color: rgba(255, 255, 255, 0.8);
    color: black;
    transform: scale(1.02);
  }

  .menu-info h2 {
    color: #b6895b;
    margin-bottom: 10px;
  }

  .menu-info p {
    color: #eee;
    font-size: 0.9rem;
    max-width: 500px;
  }

  .cold-menu:hover p,
  .hot-menu:hover p,
  .pastry-menu:hover p {
    color: #333;
  }

  img.menu-img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 20px;
  }

  .back-btn {
    font-size: 1rem;
    margin-top: 30px;
    color: white;
    background-color: var(--primary);
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  .back-btn:hover {
    background-color: rgba(255, 255, 255, 0.8);
    color: black;
    transform: scale(1.02);
  }

  .menu-item-card:hover h3 {
    color: #b6895b;
  }

  .menu-item-card:hover p {
    color: #555;
  }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 20px 0;
  }

  .menu-item-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    overflow: hidden;
    transition: 0.3s;
    text-align: center;
    padding: 15px;
  }

  .menu-item-card:hover {
    background: rgba(255, 255, 255, 0.15);
    transform: translateY(-5px);
  }

  .menu-item-card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
    margin-bottom: 15px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
  }

  .menu-item-card h3 {
    color: #b6895b;
    font-size: 1.2rem;
    margin-bottom: 5px;
  }

  .menu-item-card p {
    color: #ccc;
    font-size: 0.85rem;
    margin-bottom: 10px;
  }

  #menu-detail-container {
    animation: fadeIn 0.5s ease-in-out;
  }

  .card-image-wrapper img {
    width: 350px;
    height: 350px;
    object-fit: cover;
    border-radius: 15px;
    margin-bottom: 15px;
  }

  .price {
    display: block;
    color: #b6895b;
    font-weight: bold;
    font-size: 1.1rem;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

<body class="menu-page">
  <div class="menu-container">
    <section class="menu-utamas-coffee" id="main-menu-selection">
      <div class="cold-menu" onclick="showDetail('cold')">
        <img src="img/Unknown.jpeg" class="menu-img" alt="cold" />
        <div class="menu-info">
          <h2>Cold Menu</h2>
          <p>
            Nikmati kesegaran kopi dingin pilihan kami yang memuaskan dahaga.
          </p>
        </div>
      </div>

      <div class="hot-menu" onclick="showDetail('hot')">
        <div class="menu-info">
          <h2>Hot Menu</h2>
          <p>Kehangatan kopi autentik dengan aroma yang menenangkan jiwa.</p>
        </div>
        <img src="img/hot-beverages.jpg" class="menu-img" alt="hot" />
      </div>

      <div class="pastry-menu" onclick="showDetail('pastry')">
        <img
          src="img/Gooey Homemade Cinnamon Rolls – Soft, Fluffy & Irresistible.jpg"
          class="menu-img"
          alt="pastry"
        />
        <div class="menu-info">
          <h2>Pastry Menu</h2>
          <p>Kue lezat dan lembut sebagai teman sempurna cangkir kopi Anda.</p>
        </div>
      </div>
    </section>

    <section id="menu-detail-container" style="display: none">
      <button class="back-btn" onclick="hideDetail()">← Kembali ke Menu</button>
      <h2 id="detail-title" style="color: white; margin-bottom: 20px"></h2>
      <div id="detail-list" class="menu-grid"></div>
    </section>
  </div>
</body>

  function showDetail(category, query = null) {
    const mainSection = document.getElementById("main-menu-selection");
    const detailSection = document.getElementById("menu-detail-container");
    const detailList = document.getElementById("detail-list");
    const detailTitle = document.getElementById("detail-title");

    mainSection.style.display = "none";
    detailSection.style.display = "block";

    let items = menuData[category] || [];

    if (query) {
      items = items.filter((item) =>
        item.name.toLowerCase().includes(query.toLowerCase())
      );
      detailTitle.innerText = "HASIL PENCARIAN: " + query.toUpperCase();
    } else {
      detailTitle.innerText = category.toUpperCase() + " MENU";
    }

    // MENGGUNAKAN DESAIN UI YANG SAMA DENGAN MENU UTAMA (Layout Horizontal)
    detailList.innerHTML = items
      .map(
        (item) => `
    <div class="cold-menu" style="margin-bottom: 25px; cursor: default;">
      <img src="${item.img || "../img/header-bg.jpg"}" class="menu-img" 
           onerror="this.src='../img/header-bg.jpg'" />
      <div class="menu-info">
        <h2>${item.name}</h2>
        <p>${item.desc || "Nikmati kelezatan menu pilihan kami."}</p>
        <p class="price" style="margin-top: 10px; font-size: 1.2rem;">${
          item.price
        }</p>
      </div>
    </div>
  `
      )
      .join("");
  }

  function hideDetail() {
    document.getElementById("main-menu-selection").style.display = "flex";
    document.getElementById("menu-detail-container").style.display = "none";
    // Reset URL agar parameter search hilang saat kembali
    window.history.replaceState({}, document.title, "menu.html");
  }

  // LOGIKA OTOMATIS SAAT HALAMAN DI-LOAD
  window.onload = function () {
    const urlParams = new URLSearchParams(window.location.search);
    const searchQuery = urlParams.get("search");

    if (searchQuery) {
      const query = searchQuery.toLowerCase();
      let foundCategory = null;

      // Cari kategori mana yang mengandung menu tersebut
      for (const cat in menuData) {
        if (
          menuData[cat].some((item) => item.name.toLowerCase().includes(query))
        ) {
          foundCategory = cat;
          break;
        }
      }

      if (foundCategory) {
        showDetail(foundCategory, searchQuery);
      } else {
        alert("Maaf, menu '" + searchQuery + "' tidak ditemukan.");
      }
    }
  };

  // Fungsi untuk mengecek parameter pencarian dari hash URL
  function checkSearchParam() {
    const hash = window.location.hash;
    if (hash.includes("?search=")) {
      const searchQuery = decodeURIComponent(hash.split("?search=")[1]);

      // Cari kategori yang mengandung item tersebut
      let foundCat = "cold"; // default
      for (const cat in menuData) {
        if (
          menuData[cat].some((item) =>
            item.name.toLowerCase().includes(searchQuery.toLowerCase())
          )
        ) {
          foundCat = cat;
          break;
        }
      }
      showDetail(foundCat, searchQuery);
    }
  }

  // Jalankan saat konten dimuat oleh router
  setTimeout(checkSearchParam, 100);
</script>
